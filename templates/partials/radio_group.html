<div class="radio-group">
    <label class="block text-sm font-medium text-gray-700 mb-2">{{ field.label }}</label>
    <div class="flex flex-wrap gap-4">
        {% for choice in field %}
        <label class="flex items-center space-x-2 px-4 py-2 bg-white rounded-lg border hover:border-blue-400 transition-all">
            {{ choice.tag }}
            <span class="text-gray-700">{{ choice.choice_label }}</span>
        </label>
        {% endfor %}
    </div>
    {% if field.errors %}
    <div class="text-red-500 text-xs mt-1">{{ field.errors }}</div>
    {% endif %}
</div>
