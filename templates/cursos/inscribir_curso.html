{% extends '../cuentas/base.html' %}

{% block title %}Inscribir a Curso (Pen){% endblock %}

{% block content %}
<div class="container mt-5">
    <h1 class="mb-4">Inscribir a Curso para {{ estudiante.nombre }}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Inscribir</button>
    </form>
</div>
{% endblock %}
