<!DOCTYPE html>
<html>
    {% load i18n allauth %}
    <head>
        <title>{% translate "Sign In" %} | {{ provider }}</title>
        <meta http-equiv="refresh" content="0;URL='{{ redirect_to }}'" />
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-gray-100 h-screen flex justify-center items-center">
        <div class="bg-white rounded-lg p-8 shadow-lg w-full max-w-md text-center">
            <p class="text-lg text-gray-600 mb-6">
                {% translate "You are being redirected..." %}
            </p>
            <a href="{{ redirect_to }}" class="text-blue-600 hover:text-blue-800 text-xl font-semibold">
                {% translate "Continue" %}
            </a>
        </div>
    </body>
</html>
