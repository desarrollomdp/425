{% extends '../cuentas/base.html' %}

{% block content %}
<div class="confirmacion-container">
    <h1>¿Estás seguro de que deseas eliminar el curso "{{ curso.nombre }}"?</h1>
    <p>Esta acción no se puede deshacer.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Eliminar</button>
        <a href="{% url 'detalle_curso' curso.id %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
