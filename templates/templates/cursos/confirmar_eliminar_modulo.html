<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar Eliminación</title>
</head>
<body>
    <h1>Eliminar Módulo</h1>
    <p>¿Estás seguro de que deseas eliminar el módulo <strong>{{ modulo.nombre }}</strong>?</p>
    <form method="post" action="{% url 'eliminar_modulo' modulo.id %}">
        {% csrf_token %}
        <button type="submit">Eliminar</button>
        <a href="{% url 'listar_modulos' %}">Cancelar</a>
    </form>
</body>
</html>
