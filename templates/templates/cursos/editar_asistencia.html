{% extends '../cuentas/base.html' %}

{% block content %}
<div class="container py-5">
    <h1 class="text-center mb-4">Editar asistencia: {{ clase.nombre }}</h1>

    <form method="post" class="needs-validation" novalidate>
        {% csrf_token %}
        <div class="list-group">
            {% for estudiante in estudiantes %}
            <div class="list-group-item d-flex justify-content-between align-items-center">
                <span>{{ estudiante.first_name }} {{ estudiante.last_name }}</span>
                <div>
                    <label class="mr-2">
                        <input type="radio" name="estado_{{ estudiante.id }}" value="presente" required 
                        {% if estudiante.estado == 'presente' %}checked{% endif %}> Presente
                    </label>
                    <label>
                        <input type="radio" name="estado_{{ estudiante.id }}" value="ausente" required 
                        {% if estudiante.estado == 'ausente' %}checked{% endif %}> Ausente
                    </label>
                </div>
            </div>
            {% empty %}
            <div class="list-group-item">
                <span>No hay estudiantes inscritos en este curso.</span>
            </div>
            {% endfor %}
        </div>

        <div class="d-flex justify-content-between mt-4">
            <button type="submit" class="btn btn-primary">Guardar Cambios</button>
            <a href="{% url 'detalle_clase' clase.id %}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
