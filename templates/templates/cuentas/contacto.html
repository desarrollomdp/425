{% extends './base.html' %}
{% load static %}
{% block title %}Contacto{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-screen bg-gray-100" id="contenedor_principal_formulario">
  <div class="bg-white shadow-md rounded-lg p-8 w-full max-w-lg">
    <h2 class="text-2xl font-bold text-center mb-6">Formulario de Contacto</h2>
    <form method="post" class="space-y-6">
      {% csrf_token %}
      {% for field in form %}
        <div>
          <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-2">
            {{ field.label }}
          </label>
          {{ field }}
          {% for error in field.errors %}
            <p class="text-sm text-red-600">{{ error }}</p>
          {% endfor %}
        </div>
      {% endfor %}
      <button type="submit" class="w-full bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600" id="botonenviar">
        Enviar
      </button>
    </form>

  </div>
</div>
{% endblock %}
